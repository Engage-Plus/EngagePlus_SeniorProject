# Keeps the free tiers awake (risks H1, H2): wakes the Render API and runs a DB query
# so Supabase doesn't pause. Owner: DM. Set repo variable API_URL (Settings -> Variables),
# e.g. https://engageplus-api.onrender.com. Skips quietly until it's set.
name: keep-alive

on:
  schedule:
    - cron: "0 12 * * *" # daily, 7–8am New York
  workflow_dispatch: # "Run workflow" button: use before a demo

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and database
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repo variable not set; skipping."
            exit 0
          fi
          # A cold Render free instance can take ~1 minute to boot; retry for up to ~3 min.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$API_URL/health"; then break; fi
            echo "API not up yet (attempt $i), retrying..."
            sleep 30
          done
          echo
          curl -fsS --max-time 30 "$API_URL/health/db"
